name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }} · ${{ matrix.compiler }} · ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        exclude:
          # Homebrew GCC is not a supported compiler for the Apple SDK. Linux
          # supplies the GCC coverage; macOS is covered by AppleClang.
          - os: macos-latest
            compiler: gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select compiler
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            echo "CXX=g++" >> "$GITHUB_ENV"
            echo "CC=gcc" >> "$GITHUB_ENV"
          else
            echo "CXX=clang++" >> "$GITHUB_ENV"
            echo "CC=clang" >> "$GITHUB_ENV"
          fi

      - name: Install native transport and SSH helpers (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          brew install sshpass || true

      - name: Configure
        run: cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: Smoke test CLI
        run: |
          ./build/bin/pipeshellx --version
          ./build/bin/pipeshellx --help
          if ./build/bin/pipeshellx --bogus; then
            echo "unknown CLI option unexpectedly succeeded" >&2
            exit 1
          fi

  packaging:
    name: Install + downstream CMake package (ubuntu, Release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure static-OpenSSL release
        run: >-
          cmake -S . -B build-package -DCMAKE_BUILD_TYPE=Release
          -DPIPESHELLX_BUILD_TESTS=OFF -DPIPESHELLX_BUILD_BENCH=OFF
          -DPIPESHELLX_STATIC_OPENSSL=ON

      - name: Build and install
        run: |
          cmake --build build-package --parallel
          cmake --install build-package --prefix "$RUNNER_TEMP/pipeshellx-prefix"

      - name: Smoke installed CLI and exported package
        run: |
          "$RUNNER_TEMP/pipeshellx-prefix/bin/pipeshellx" --version
          test -f "$RUNNER_TEMP/pipeshellx-prefix/share/doc/pipeshellx/LICENSE"
          test -f "$RUNNER_TEMP/pipeshellx-prefix/share/doc/pipeshellx/NOTICE"
          test -f "$RUNNER_TEMP/pipeshellx-prefix/share/doc/pipeshellx/README.md"
          test -f "$RUNNER_TEMP/pipeshellx-prefix/share/doc/pipeshellx/CHANGELOG.md"
          test -f "$RUNNER_TEMP/pipeshellx-prefix/include/psx/pipeline/planner.hpp"
          test ! -e "$RUNNER_TEMP/pipeshellx-prefix/include/cli_options.hpp"
          test ! -e "$RUNNER_TEMP/pipeshellx-prefix/include/psx/cli"
          test ! -e "$RUNNER_TEMP/pipeshellx-prefix/include/psx/os/backend.hpp"
          if grep -R -E "$GITHUB_WORKSPACE|pipeshellx_warnings" \
            "$RUNNER_TEMP/pipeshellx-prefix/lib/cmake/pipeshellx"; then
            echo "installed CMake export leaked a build path or warnings target" >&2
            exit 1
          fi
          cmake -S tests/packaging/downstream -B build-consumer \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/pipeshellx-prefix"
          cmake --build build-consumer --parallel
          ./build-consumer/bin/pipeshellx_package_consumer

  native-off:
    name: SSH-only build without OpenSSL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure without discovering OpenSSL
        run: >-
          cmake -S . -B build-native-off -DCMAKE_BUILD_TYPE=Release
          -DPIPESHELLX_NATIVE_TRANSPORT=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE
          -DPIPESHELLX_BUILD_TESTS=OFF -DPIPESHELLX_BUILD_BENCH=OFF

      - name: Build, install, and smoke
        run: |
          cmake --build build-native-off --parallel
          ./build-native-off/bin/pipeshellx --version
          ./build-native-off/bin/pipeshellx --help
          cmake --install build-native-off --prefix "$RUNNER_TEMP/pipeshellx-native-off"
          cmake -S tests/packaging/downstream -B build-native-off-consumer \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/pipeshellx-native-off"
          cmake --build build-native-off-consumer --parallel
          ./build-native-off-consumer/bin/pipeshellx_package_consumer

  layering:
    name: Layering + documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check layering rules
        run: ./scripts/check_layering.sh
      - name: Check documentation links
        run: ./scripts/check_docs.py

  sanitizers:
    name: ASan + UBSan (ubuntu, clang, Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DPIPESHELLX_SANITIZE=address,undefined
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 180
